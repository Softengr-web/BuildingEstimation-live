function calcSafety(type){if(type==='rod')return`<div class="notice notice-warning" style="margin-top:14px">${icon('warning')}<div><strong>কাঠামোগত সীমাবদ্ধতা</strong><p>প্রবেশ করানো রডের তথ্য থেকে শুধু পরিমাণ অনুমান করা হয়। নিরাপদ রডের বিন্যাস, কভার, ল্যাপ, হুক, বেন্ডিং ও অ্যাংকরেজ অনুমোদিত কাঠামোগত নকশা ও প্রকৌশলীর বিবিএস অনুসরণ করুন।</p></div></div>`;if(type==='concrete')return`<div class="notice notice-warning" style="margin-top:14px">${icon('warning')}<p>নামমাত্র আয়তনভিত্তিক অনুপাত আনুমানিক হিসাবের জন্য; এটি পেশাগত কংক্রিট মিক্স ডিজাইন নয়।</p></div>`;if(type==='land')return`<div class="notice" style="margin-top:14px">${icon('info')}<p>স্থানীয় জমির একক এলাকাভেদে বদলায়। সেটিংসের রূপান্তর মান ও সাইটের চূড়ান্ত জরিপ যাচাই করুন।</p></div>`;return''}
function calcGuide(){return'<section class="calc-guide" aria-label="ক্যালকুলেটর ব্যবহারের ধাপ"><div class="calc-guide-steps"><span><b>১</b> মাপ লিখুন</span><span><b>২</b> হিসাব দেখুন</span><span><b>৩</b> দরকার হলে সংরক্ষণ করুন</span></div><p>আপনার জানা তথ্য দিন। ফলাফল সঙ্গে সঙ্গে দেখা যাবে; কোনো মাপ বা দর ঠিক করতে চাইলে ইনপুট বদলান।</p></section>'}
function renderCalculator(type){const meta=CALC_META[type];if(!meta){go('calculators');return}const v=ensureDraft(type),defs=calcDefs[type]();const projectOptions=`<option value="">কোনো প্রজেক্টে সংযুক্ত নয়</option>`+state.projects.map(p=>`<option value="${p.id}" ${v.projectId===p.id?'selected':''}>${esc(p.name)}</option>`).join('');$('#view').innerHTML=pageHead(meta[0],meta[1],`<button class="btn btn-secondary btn-sm" data-action="reset-calc">${icon('back')} রিসেট</button>`,'calculators')+calcGuide()+`<div class="calc-layout"><section class="calc-form-card"><form id="calc-form" data-type="${type}" novalidate><div class="form-error" id="form-error" role="alert"></div><div class="form-section"><h3>১. কাজের ধরন ও ২. পরিমাপ</h3><div class="form-grid two">${defs.slice(0,type==='tiles'?8:6).filter(f=>!f.when||f.when(v)).map(f=>inputField(f,v)).join('')}</div></div><div class="form-section"><h3>৩. উপকরণের স্পেসিফিকেশন ও ৪. দর</h3><div class="form-grid two">${defs.slice(type==='tiles'?8:6).filter(f=>!f.when||f.when(v)).map(f=>inputField(f,v)).join('')}</div>${type==='rod'&&v.mode==='bbs'?bbsRows(v):''}</div><div class="form-section"><h3>৫. ফলাফল সংরক্ষণ</h3>${field('প্রজেক্টে সংযুক্ত করুন (ঐচ্ছিক)',`<select name="projectId" id="f-projectId">${projectOptions}</select>`,'প্রজেক্ট বাছাই করলে উপকরণের সারাংশে এই ফলাফল যোগ হবে।')}</div><div class="btn-row" style="margin-top:16px"><button class="btn btn-primary" type="submit">${icon('calc')} হিসাব দেখুন</button><button class="btn btn-secondary" type="button" data-action="save-calc">${icon('save')} ${editRecordId?'পরিবর্তন সংরক্ষণ':'ফলাফল সংরক্ষণ'}</button></div></form>${calcSafety(type)}</section><section class="result-card" id="calc-result" aria-live="polite"></section></div>`;recalculate(false)}
function readCalcForm(){const form=$('#calc-form');if(!form)return null;const out={};new FormData(form).forEach((v,k)=>out[k]=v);return out}
function clearFieldErrors(){$$('.field-error.dynamic').forEach(x=>x.remove());$$('[aria-invalid="true"]').forEach(x=>x.removeAttribute('aria-invalid'))}
function showCalcErrors(errors){clearFieldErrors();const box=$('#form-error');if(box){box.innerHTML=errors.map(e=>esc(e.msg)).join('<br>');box.classList.add('show')}errors.filter(e=>e.field).forEach(e=>{const input=$(`[name="${CSS.escape(e.field)}"]`);if(input){input.setAttribute('aria-invalid','true');const p=document.createElement('p');p.className='field-error dynamic';p.textContent=e.msg;input.closest('.field')?.append(p)}})}
function resultText(type,v,r){return`${CALC_META[type][0]}\n${r.rows.map(x=>`${x[0]}: ${x[1]}`).join('\n')}\nমোট আনুমানিক খরচ: ${money(r.total)}\n\n${r.formula.replace(/<br>/g,'\n').replace(/<[^>]+>/g,'')}`}
function recalculate(showErrors=true){const form=$('#calc-form');if(!form)return null;const type=form.dataset.type,v=readCalcForm();drafts[type]=Object.assign(drafts[type],v);const r=engines[type](drafts[type]);clearFieldErrors();$('#form-error')?.classList.remove('show');if(r.errors){lastCalculation={type,values:drafts[type],result:r};if(showErrors)showCalcErrors(r.errors);$('#calc-result').innerHTML=`<div class="result-empty">${icon('warning','icon')}<strong>হিসাব সম্পূর্ণ করা যায়নি</strong><p class="small" style="margin-top:6px">চিহ্নিত ঘরগুলির মান ঠিক করুন। ফলাফল এখনো তৈরি হয়নি।</p></div>`;if(showErrors)showCalcErrors(r.errors);return null}lastCalculation={type,values:structuredClone(drafts[type]),result:r};const land=type==='land',main=land?`${r.rows[0][1]} বর্গফুট`:money(r.total);$('#calc-result').innerHTML=`<div class="result-total"><div class="result-total-label">${land?'জমির মোট এলাকা':'মোট আনুমানিক খরচ'}</div><div class="result-total-value">${main}</div><div class="result-total-note">সম্পাদনাযোগ্য ইনপুট ও দরের ভিত্তিতে</div></div><table class="result-table"><tbody>${r.rows.map(row=>`<tr><th>${row[0]}</th><td class="num">${row[1]}</td></tr>`).join('')}</tbody></table>${r.groups.length?`<div class="group-table"><h4>রডের গ্রুপভিত্তিক বিশ্লেষণ</h4>${r.groups.map(g=>`<div class="group-row"><span>${esc(g.label)}</span><strong>${fmt(g.weight,3)} কেজি</strong><small>ব্যাস ${fmt(g.dia)} মিমি · দৈর্ঘ্য ${fmt(g.length,3)} মি · ${fmt(g.qty)}টি · ${fmt(g.unit,3)} কেজি/মি</small></div>`).join('')}</div>`:''}<details class="formula"><summary>সূত্র ও অনুমান দেখুন</summary><div class="formula-content"><p>${r.formula}</p></div></details><div class="btn-row" style="margin-top:14px"><button class="btn btn-secondary btn-sm" data-action="copy-calc">${icon('copy')} কপি</button><button class="btn btn-secondary btn-sm" data-action="print-calc">${icon('print')} প্রিন্ট</button>${editRecordId?`<button class="btn btn-danger btn-sm" data-action="delete-editing-record">${icon('trash')} মুছুন</button>`:''}</div>`;return r}
function saveCalculation(){const r=recalculate(true);if(!r){toast('সংরক্ষণের আগে ইনপুটের ভুল ঠিক করুন।','error');return}const {type,values}=lastCalculation,now=new Date().toISOString(),old=state.records.find(x=>x.id===editRecordId);const rec={id:old?.id||uid('calc'),type,title:CALC_META[type][0],projectId:values.projectId||'',inputs:structuredClone(values),rows:r.rows,total:r.total,materials:r.materials,groups:r.groups,formula:r.formula,createdAt:old?.createdAt||now,updatedAt:now};if(old)state.records=state.records.map(x=>x.id===old.id?rec:x);else state.records.unshift(rec);state.recents=[type,...state.recents.filter(x=>x!==type)].slice(0,4);editRecordId=rec.id;persist();renderNav();toast(old?'সংরক্ষিত হিসাব হালনাগাদ হয়েছে।':'হিসাব সংরক্ষণ হয়েছে।','success');renderCalculator(type)}
function projectTotal(p){if(!p)return 0;if(p.method==='quick'){const area=parseNum(p.quickArea,0),factor=p.quickUnit==='m2'?1:M2FT,rate=parseNum(p.quickRate,0);return area*factor*rate+parseNum(p.additionalCost,0)}const direct=boqDirect(p),extra=['materialCost','laborCost','equipmentCost','transportCost','otherDirectCost'].reduce((s,k)=>s+parseNum(p[k],0),0),base=direct+extra,overhead=base*parseNum(p.overheadPct,0)/100,profit=(base+overhead)*parseNum(p.profitPct,0)/100,contingency=(base+overhead+profit)*parseNum(p.contingencyPct,0)/100,tax=(base+overhead+profit+contingency)*parseNum(p.taxPct,0)/100;return base+overhead+profit+contingency+tax}
function boqDirect(p){return(p?.items||[]).filter(i=>i.enabled).reduce((s,i)=>s+parseNum(i.quantity,0)*(1+parseNum(i.allowance,0)/100)*parseNum(i.rate,0),0)}
function projectProgress(p){const done=(p?.items||[]).filter(i=>i.enabled&&parseNum(i.quantity,0)>0&&parseNum(i.rate,0)>0).length;return Math.round(done/BOQ_CATEGORIES.length*100)}
function materialSummary(projectId){const agg={};projectRecords(projectId).forEach(r=>(r.materials||[]).forEach(m=>{const key=`${m.name}|${m.unit}`;if(!agg[key])agg[key]={name:m.name,unit:m.unit,qty:0,cost:0};agg[key].qty+=parseNum(m.qty,0);agg[key].cost+=parseNum(m.cost,0)}));return Object.values(agg)}

iv></div>${!storageOK?`<div class="notice notice-warning" style="margin-top:14px">${icon('warning')}<p>ব্রাউজার স্টোরেজ পাওয়া যাচ্ছে না। তথ্য এই সেশনে থাকবে; এখনই সেটিংস থেকে JSON ব্যাকআপ নিন।</p></div>`:''}<div class="section-head"><h2 class="section-title">আপনি কী হিসাব করতে চান?</h2><button class="section-link" data-route="calculators">সব দেখুন ${icon('arrow')}</button></div><div class="tool-grid">${Object.keys(CALC_META).map(toolCard).join('')}</div><div class="section-head"><h2 class="section-title">আপনার সাম্প্রতিক কাজ</h2><button class="section-link" data-route="files">আমার হিসাব</button></div><div class="project-grid"><section class="card"><div class="section-head" style="margin:0 0 5px"><h3 class="section-title">সংরক্ষিত হিসাব</h3></div>${recentRecordRows(records)}</section><section class="card"><div class="section-head" style="margin:0 0 5px"><h3 class="section-title">সম্প্রতি সম্পাদিত প্রজেক্ট</h3></div>${state.projects.length?`<div class="list">${[...state.projects].sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||'')).slice(0,4).map(x=>`<div class="list-row"><div class="list-main"><button class="btn btn-ghost" style="padding:0;min-height:30px" data-action="open-project" data-id="${x.id}">${esc(x.name)}</button><div class="list-meta">${esc(x.location||'অবস্থান দেওয়া নেই')} · ${dateBn(x.updatedAt)}</div></div><div class="list-value">${money(projectTotal(x))}</div></div>`).join('')}</div>`:emptyState('প্রথম প্রজেক্টটি তৈরি করুন','বাড়ির আয়তন, তলা ও খরচের ধরন দিয়ে পূর্ণাঙ্গ এস্টিমেট শুরু করুন।','new-project','নতুন প্রজেক্ট','building')}</section></div>${p&&mats.length?`<div class="section-head"><h2 class="section-title">${esc(p.name)} — উপকরণের সারাংশ</h2></div><section class="card"><div class="list">${mats.slice(0,6).map(m=>`<div class="list-row"><div class="list-main"><div class="list-title">${esc(m.name)}</div><div class="list-meta">সংরক্ষিত ক্যালকুলেটর থেকে</div></div><div class="list-value num">${fmt(m.qty,3)} ${esc(m.unit)}<div class="list-meta">${money(m.cost)}</div></div></div>`).join('')}</div></section>`:''}<div class="section-head"><h2 class="section-title">সম্প্রতি ব্যবহৃত টুল</h2></div>${recent.length?`<div class="btn-row">${state.recents.map(t=>`<button class="btn btn-secondary" data-route="calculator/${t}">${icon(CALC_META[t][2])} ${CALC_META[t][0]}</button>`).join('')}</div>`:`<p class="muted small">ক্যালকুলেটর ব্যবহার করলে সেগুলি এখানে দ্রুত খোলার জন্য থাকবে।</p>`}<div class="notice" style="margin-top:24px">${icon('info')}<p>তথ্য শুধু এই ব্রাউজারে জমা হয় এবং অন্য ডিভাইসে সিঙ্ক হয় না। ব্রাউজারের ডেটা মুছলে তথ্যও মুছে যেতে পারে—নিয়মিত JSON ব্যাকআপ রাখুন।</p></div>`}
function renderCalculators(){$('#view').innerHTML=pageHead('ক্যালকুলেটর','যে কাজের হিসাব দরকার সেটি বেছে নিন। মাপ লিখলে ফলাফল দেখাবে; সূত্র ও অনুমানও দেখতে পারবেন।')+`<div class="tool-grid">${Object.keys(CALC_META).map(toolCard).join('')}</div><div class="section-head"><h2 class="section-title">আরও তথ্য ও পরিকল্পনা</h2></div><div class="tool-grid"><button class="tool-card wide" data-route="drawings"><span class="tool-icon">${icon('building','icon icon-lg')}</span><span class="tool-arrow">${icon('arrow')}</span><h3>রুমের মাপ ও পরিকল্পনা</h3><p>রুমের তালিকা, তলার নোট ও নমুনা বিন্যাস</p></button><button class="tool-card wide" data-route="library"><span class="tool-icon">${icon('notes','icon icon-lg')}</span><span class="tool-arrow">${icon('arrow')}</span><h3>হিসাবের নিয়ম ও দরকারি তথ্য</h3><p>একক, অনুপাত, অপচয় ও পেশাগত যাচাইয়ের সহজ নির্দেশনা</p></button></div>`}
let estimateView='active',projectFormMode='new';
function floorAreaTotal(p){return String(p.floorAreas||'').split(/[,;\n]+/).reduce((s,x)=>s+parseNum(x,0),0)}
function projectAreaM2(p){const area=parseNum(p.quickArea,0)||floorAreaTotal(p);return area*(p.quickUnit==='m2'||p.areaUnit==='m2'?1:.09290304)}
function newProjectForm(p=null){const edit=!!p;return pageHead(edit?'প্রজেক্ট সম্পাদনা':'নতুন বিল্ডিং প্রজেক্ট','প্রথমে বাড়ির নাম, তলা ও মোট মাপ লিখুন। চাইলে এই তথ্য পরে সম্পাদনা করতে পারবেন।','',p?'estimate':'')+`<section class="card"><form id="project-form" data-id="${p?.id||''}" novalidate><div class="form-error" id="project-error"></div><div class="form-section"><h3>১. বাড়ি / প্রজেক্টের পরিচয়</h3><div class="form-grid two">${field('প্রজেক্টের নাম <span class="required">*</span>',`<input name="name" value="${esc(p?.name||'')}" placeholder="যেমন: আমার দোতলা বাড়ি" required>`)}${field('অবস্থান',`<input name="location" value="${esc(p?.location||'')}" placeholder="জেলা, এলাকা">`)}${field('প্রজেক্টের তারিখ',`<input type="date" name="date" value="${esc(p?.date||today())}">`)}${field('মালিক / ক্লায়েন্টের নাম',`<input name="owner" value="${esc(p?.owner||'')}">`)}${field('ভবনের ধরন',`<select name="buildingType">${['আবাসিক বাড়ি','অ্যাপার্টমেন্ট','দোকান / বাণিজ্যিক','গুদাম','অন্যান্য'].map(x=>`<option ${p?.buildingType===x?'selected':''}>${x}</option>`).join('')}</select>`)}${field('প্রজেক্ট নোট',`<textarea name="notes">${esc(p?.notes||'')}</textarea>`)}</div></div><div class="form-section"><h3>২. তলা ও মাপ</h3><div class="form-grid two">${field('তলার সংখ্যা',`<input name="floors" inputmode="numeric" value="${esc(p?.floors||'1')}">`)}${field('প্রতি তলার উচ্চতা (ফুট)',`<input name="floorHeight" inputmode="decimal" value="${esc(p?.floorHeight||'10')}">`)}${field('প্রতি তলার নির্মিত এলাকা',`<textarea name="floorAreas" placeholder="যেমন: ১২০০, ১২০০, ৮০০">${esc(p?.floorAreas||'')}</textarea>`,'কমা দিয়ে তলাগুলির এলাকা লিখুন; একক নিচে নির্বাচন করুন।')}${field('এলাকার একক',`<select name="areaUnit"><option value="ft2" ${p?.areaUnit!=='m2'?'selected':''}>বর্গফুট</option><option value="m2" ${p?.areaUnit==='m2'?'selected':''}>বর্গমিটার</option></select>`)}</div></div><div class="btn-row" style="margin-top:16px"><button class="btn btn-primary" type="submit">${icon('save')} ${edit?'পরিবর্তন সংরক্ষণ':'প্রজেক্ট তৈরি করুন'}</button><button class="btn btn-secondary" type="button" data-action="project-list">বাতিল</button></div></form></section>`}
function saveProject(form){const data=Object.fromEntries(new FormData(form)),errors=[];if(!data.name.trim())errors.push('প্রজেক্টের নাম দিন।');const floors=parseNum(data.floors);if(!Number.isInteger(floors)||floors<1)errors.push('তলার সংখ্যা পূর্ণসংখ্যায় ও শূন্যের বেশি দিন।');const fh=parseNum(data.floorHeight);if(!Number.isFinite(fh)||fh<=0)errors.push('তলার উচ্চতা শূন্যের বেশি দিন।');const areas=String(data.floorAreas||'').split(/[,;\n]+/).filter(x=>x.trim()).map(x=>parseNum(x));if(areas.some(x=>!Number.isFinite(x)||x<0))errors.push('তলার এলাকায় শুধু বৈধ ধনাত্মক সংখ্যা দিন।');if(errors.length){$('#project-error').innerHTML=errors.map(esc).join('<br>');$('#project-error').classList.add('show');return}const old=state.projects.find(p=>p.id===form.dataset.id),now=new Date().toISOString();const p=old||{id:uid('project'),items:makeBoq(),method:'quick',quickRate:0,additionalCost:0,quickUnit:data.areaUnit,rateSource:'',materialCost:0,laborCost:0,equipmentCost:0,transportCost:0,otherDirectCost:0,overheadPct:0,profitPct:0,contingencyPct:0,taxPct:0,createdAt:now};Object.assign(p,data,{floors,quickArea:old?.quickArea??areas.reduce((s,x)=>s+x,0),updatedAt:now});if(!old)state.projects.unshift(p);state.activeProjectId=p.id;persist();estimateView='active';currentProjectTab='overview';renderNav();renderEstimate();toast(old?'প্রজেক্ট হালনাগাদ হয়েছে।':'নতুন প্রজেক্ট তৈরি হয়েছে।','success')}
function projectHeader(p){return pageHead(esc(p.name),`${esc(p.buildingType||'ভবন')} · ${esc(p.location||'অবস্থান দেওয়া নেই')}`,`<button class="btn btn-secondary btn-sm" data-action="project-list">${icon('files')} সব প্রজেক্ট</button><button class="btn btn-secondary btn-sm" data-action="edit-project" data-id="${p.id}">${icon('edit')} সম্পাদনা</button><button class="btn btn-secondary btn-sm" data-action="export-project" data-id="${p.id}">${icon('download')} ব্যাকআপ</button><button class="btn btn-primary btn-sm" data-action="print-project" data-id="${p.id}">${icon('print')} প্রতিবেদন</button>`)+`<div class="project-meta"><span class="badge">${toBn(p.floors)} তলা</span><span class="badge badge-neutral">${p.method==='quick'?'প্রাথমিক এস্টিমেট সক্রিয়':'কাজ ধরে বিস্তারিত হিসাব সক্রিয়'}</span><span class="badge badge-neutral">হালনাগাদ ${dateBn(p.updatedAt)}</span></div>`}
function projectTabs(p){return`<div class="tabs" role="tablist">${[['overview','সারসংক্ষেপ'],['quick','দ্রুত প্রাথমিক হিসাব'],['boq','কাজ ধরে খরচ'],['summary','খরচ ও উপকরণ']].map(t=>`<button class="tab ${currentProjectTab===t[0]?'active':''}" data-action="project-tab" data-tab="${t[0]}" role="tab" aria-selected="${currentProjectTab===t[0]}">${t[1]}</button>`).join('')}</div>`}
function projectStats(p){const area=projectAreaM2(p),total=projectTotal(p);return`<div class="stats-grid"><div class="stat stat-accent"><div class="stat-label">সক্রিয় পদ্ধতিতে মোট খরচ</div><div class="stat-value num">${money(total)}</div><div class="stat-note">${p.method==='quick'?'দ্রুত প্রাথমিক হিসাব':'বিস্তারিত বিওকিউ'}</div></div><div class="stat"><div class="stat-label">মোট নির্মিত এলাকা</div><div class="stat-value num">${fmt(area*M2FT)} বর্গফুট</div><div class="stat-note">${fmt(area)} বর্গমিটার</div></div><div class="stat"><div class="stat-label">প্রতি বর্গফুট খরচ</div><div class="stat-value num">${area?money(total/(area*M2FT)):'—'}</div><div class="stat-note">সক্রিয় পদ্ধতি থেকে</div></div><div class="stat"><div class="stat-label">চালু করা কাজের সারি</div><div class="stat-value num">${toBn(p.items.filter(i=>i.enabled).length)}টি</div><div class="stat-note">মোট ${toBn(p.items.length)}টি কাজ</div></div></div>`}
function renderProjectOverview(p){const mats=materialSummary(p.id),recs=projectRecords(p.id);return`${projectStats(p)}<div class="notice" style="margin-top:14px">${icon('info')}<p><strong>দুই পদ্ধতির খরচ কখনো একসাথে যোগ হয় না।</strong> বর্তমানে ${p.method==='quick'?'দ্রুত প্রাথমিক হিসাব':'বিস্তারিত বিওকিউ'} সক্রিয়। ট্যাব থেকে পদ্ধতি বদলালে সক্রিয় বোতল ব্যবহার করুন।</p></div><div class="section-head"><h2 class="section-title">এস্টিমেটের ধরন</h2></div><div class="project-grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))"><section class="card"><span class="badge ${p.method==='quick'?'':'badge-neutral'}">${p.method==='quick'?'সক্রিয়':'বিকল্প'}</span><h3 style="margin:10px 0 5px;color:var(--navy)">দ্রুত প্রাথমিক হিসাব</h3><p class="small muted">নির্মিত এলাকা × আপনার দেওয়া দর। এতে প্রতিটি কাজ আলাদা করে হিসাব হয় না।</p><button class="btn btn-secondary" data-action="project-tab" data-tab="quick" style="margin-top:14px">হিসাব খুলুন ${icon('arrow')}</button></section><section class="card"><span class="badge ${p.method==='boq'?'':'badge-neutral'}">${p.method==='boq'?'সক্রিয়':'বিকল্প'}</span><h3 style="margin:10px 0 5px;color:var(--navy)">বিস্তারিত বিওকিউ</h3><p class="small muted">কাজ, পরিমাণ, দর, ভাতা, অতিরিক্ত খরচ ও শতাংশভিত্তিক সারাংশ।</p><button class="btn btn-secondary" data-action="project-tab" data-tab="boq" style="margin-top:14px">বিওকিউ খুলুন ${icon('arrow')}</button></section></div><div class="section-head"><h2 class="section-title">প্রজেক্টে সংযুক্ত ক্যালকুলেটর</h2><button class="section-link" data-route="calculators">নতুন হিসাব</button></div><section class="card">${recentRecordRows(recs)}</section>${mats.length?`<div class="section-head"><h2 class="section-title">মোট উপকরণের পরিমাণ</h2></div><section class="card"><div class="list">${mats.map(m=>`<div class="list-row"><div class="list-main"><div class="list-title">${esc(m.name)}</div><div class="list-meta">সংযুক্ত সংরক্ষিত হিসাব থেকে</div></div><div class="list-value num">${fmt(m.qty,3)} ${esc(m.unit)}<div class="list-meta">${money(m.cost)}</div></div></div>`).join('')}</div></section>`:''}`}
function renderQuick(p){const total=projectTotal({...p,method:'quick'});return`<div class="calc-layout"><section class="calc-form-card"><form id="quick-form"><div class="notice notice-warning" style="margin-bottom:16px">${icon('warning')}<p>এটি প্রাথমিক আনুমানিক খরচ, বিস্তারিত বিওকিউ নয়। বাজারের বর্তমান দর বলে দাবি করা হয়নি—দর ও উৎস আপনি দিন।</p></div><div class="form-grid two">${field('মোট নির্মিত এলাকা',`<input name="quickArea" inputmode="decimal" value="${esc(p.quickArea||0)}">`)}${field('এলাকার একক',`<select name="quickUnit"><option value="ft2" ${p.quickUnit!=='m2'?'selected':''}>বর্গফুট</option><option value="m2" ${p.quickUnit==='m2'?'selected':''}>বর্গমিটার</option></select>`)}${field('আপনার নির্ধারিত দর',`<input name="quickRate" inputmode="decimal" value="${esc(p.quickRate||0)}">`)}${field('দরের উৎস / রেফারেন্স',`<input name="rateSource" value="${esc(p.rateSource||'')}" placeholder="সরবরাহকারী, ঠিকাদার বা হিসাবের উৎস">`)}${field('অতিরিক্ত অন্তর্ভুক্ত খরচ',`<input name="additionalCost" inputmode="decimal" value="${esc(p.additionalCost||0)}">`)}${field('বাদ দেওয়া খরচের নোট',`<input name="excludedNote" value="${esc(p.excludedNote||'')}" placeholder="যা এই হিসাবে অন্তর্ভুক্ত নয়">`)}</div><div class="btn-row" style="margin-top:16px"><button class="btn btn-primary" type="submit">${icon('save')} প্রাথমিক হিসাব সংরক্ষণ</button><button class="btn ${p.method==='quick'?'btn-secondary':'btn-primary'}" type="button" data-action="activate-method" data-method="quick" ${p.method==='quick'?'disabled':''}>${icon('check')} ${p.method==='quick'?'এই পদ্ধতি সক্রিয়':'এই পদ্ধতি সক্রিয় করুন'}</button></div></form></section><section class="result-card"><div class="result-total"><div class="result-total-label">প্রাথমিক আনুমানিক খরচ</div><div class="result-total-value" id="quick-total">${money(total)}</div><div class="result-total-note">অন্য পদ্ধতির খরচ যোগ হয়নি</div></div><table class="result-table"><tbody><tr><th>নির্মিত এলাকা</th><td id="quick-area">${fmt(parseNum(p.quickArea,0))} ${p.quickUnit==='m2'?'বর্গমিটার':'বর্গফুট'}</td></tr><tr><th>একক দর</th><td id="quick-rate">${money(p.quickRate)}</td></tr><tr><th>অতিরিক্ত খরচ</th><td id="quick-add">${money(p.additionalCost)}</td></tr></tbody></table><details class="formula"><summary>সূত্র ও সীমাবদ্ধতা</summary><div class="formula-content">প্রাথমিক খরচ = নির্মিত এলাকা × আপনার দেওয়া একক দর + অতিরিক্ত অন্তর্ভুক্ত খরচ। বাদ দেওয়া খরচ শুধু নোট হিসেবে থাকে, স্বয়ংক্রিয়ভাবে বিয়োগ হয় না।</div></details></section></div>`}
function rateOptions(selected,unit){return`<option value="">দর সংযুক্ত নয়</option>`+state.rates.map(r=>`<option value="${r.id}" ${selected===r.id?'selected':''}>${esc(r.name)} · ${money(r.rate)}/${esc(r.unit)}</option>`).join('')}
function boqItemCard(p,i,index){const amount=parseNum(i.quantity,0)*(1+parseNum(i.allowance,0)/100)*parseNum(i.rate,0);return`<details class="boq-item ${i.enabled?'':'disabled-item'}" data-item="${i.id}" ${i.enabled?'open':''}><summary><span class="boq-number">${toBn(index+1)}.</span><span class="boq-title">${esc(i.category)}</span><span class="badge ${i.enabled?'':'badge-neutral'}">${i.enabled?'সক্রিয়':'নিষ্ক্রিয়'}</span><strong class="boq-summary-amount num">${money(amount)}</strong></summary><div class="boq-detail"><div class="boq-top"><label class="switch"><input type="checkbox" data-item-field="enabled" data-id="${i.id}" ${i.enabled?'checked':''}> এই কাজটি হিসাবে অন্তর্ভুক্ত করুন</label></div><div class="form-grid three"><div>${field('কাজের ধরন',`<input data-item-field="category" data-id="${i.id}" value="${esc(i.category)}">`)}</div><div>${field('বিবরণ',`<input data-item-field="description" data-id="${i.id}" value="${esc(i.description)}">`)}</div><div>${field('তলা',`<select data-item-field="floor" data-id="${i.id}"><option value="সব">সব তলা</option>${Array.from({length:p.floors},(_,n)=>`<option value="${n+1}" ${String(i.floor)===String(n+1)?'selected':''}>${toBn(n+1)} তলা</option>`).join('')}</select>`)}</div><div>${field('পরিমাণ',`<input data-item-field="quantity" data-id="${i.id}" data-number="true" inputmode="decimal" value="${esc(i.quantity)}">`)}</div><div>${field('একক',`<input data-item-field="unit" data-id="${i.id}" value="${esc(i.unit)}">`)}</div><div>${field('একক দর',`<input data-item-field="rate" data-id="${i.id}" data-number="true" inputmode="decimal" value="${esc(i.rate)}">`)}</div><div>${field('পরিমাণে ভাতা (%)',`<input data-item-field="allowance" data-id="${i.id}" data-number="true" inputmode="decimal" value="${esc(i.allowance)}">`)}</div><div>${field('সংরক্ষিত দর সংযোগ',`<select data-item-field="rateId" data-id="${i.id}">${rateOptions(i.rateId,i.unit)}</select>`,'দর বাছলে একক দরে সেটি বসবে।')}</div><div>${field('উৎস / রেফারেন্স',`<input data-item-field="source" data-id="${i.id}" value="${esc(i.source)}">`)}</div></div><div style="margin-top:12px">${field('মন্তব্য',`<input data-item-field="remarks" data-id="${i.id}" value="${esc(i.remarks)}">`)}</div><div class="boq-amount">পরিমাণে ভাতাসহ মোট: <span data-item-amount="${i.id}">${money(amount)}</span></div><div class="row-actions" style="margin-top:10px"><button class="btn btn-ghost btn-sm" data-action="boq-up" data-id="${i.id}" aria-label="উপরে নিন">${icon('up')} উপরে</button><button class="btn btn-ghost btn-sm" data-action="boq-down" data-id="${i.id}" aria-label="নিচে নিন">${icon('down')} নিচে</button><button class="btn btn-ghost btn-sm" data-action="boq-duplicate" data-id="${i.id}">${icon('duplicate')} নকল</button><button class="btn btn-danger btn-sm" data-action="boq-delete" data-id="${i.id}">${icon('trash')} মুছুন</button></div></div></details>`}
function extrasForm(p){const fields=[['materialCost','অতিরিক্ত উপকরণ খরচ'],['laborCost','অতিরিক্ত শ্রম খরচ'],['equipmentCost','যন্ত্র ও মেশিন'],['transportCost','পরিবহন'],['otherDirectCost','অন্যান্য প্রত্যক্ষ খরচ'],['overheadPct','ওভারহেড (%)'],['profitPct','ঠিকাদার লাভ (%)'],['contingencyPct','অনিশ্চিত খরচ (%)'],['taxPct','কর / ভ্যাট (%)']];return`<details class="advanced" open><summary>অতিরিক্ত খরচ ও শতাংশ</summary><form id="extras-form"><div class="notice notice-warning" style="margin-bottom:12px">${icon('warning')}<p>বিওকিউতে যে খরচ এসেছে সেটি আবার এখানে যোগ করবেন না। ওভারহেড প্রত্যক্ষ খরচের ওপর; লাভ প্রত্যক্ষ + ওভারহেডের ওপর; অনিশ্চিত খরচ পরবর্তী সাবটোটালের ওপর; কর সর্বশেষ সাবটোটালের ওপর ধরা হয়।</p></div><div class="form-grid three">${fields.map(f=>field(f[1],`<input name="${f[0]}" inputmode="decimal" value="${esc(p[f[0]]||0)}">`)).join('')}</div><button class="btn btn-primary" type="submit" style="margin-top:14px">${icon('save')} অতিরিক্ত খরচ সংরক্ষণ</button></form></details>`}
function renderBoq(p){return`<div class="notice" style="margin-bottom:14px">${icon('info')}<p>প্রতিটি কাজের খরচ = পরিমাণ × একক দর। অপচয় বা কাটিংয়ের জন্য ভাতা (%) যোগ করতে পারেন। যে কাজ দরকার, সেটি সক্রিয় রাখুন; বাকি কাজ নিষ্ক্রিয় করুন।</p></div><div class="btn-row" style="margin-bottom:14px"><button class="btn btn-primary" data-action="boq-add">${icon('plus')} নতুন কাজের সারি</button><button class="btn ${p.method==='boq'?'btn-secondary':'btn-primary'}" data-action="activate-method" data-method="boq" ${p.method==='boq'?'disabled':''}>${icon('check')} ${p.method==='boq'?'কাজ ধরে হিসাব চালু':'কাজ ধরে হিসাব চালু করুন'}</button><button class="btn btn-secondary" data-action="export-boq" data-id="${p.id}">${icon('download')} সিএসভি এক্সপোর্ট</button></div><div class="stats-grid" style="margin:0 0 14px"><div class="stat stat-accent"><div class="stat-label">সক্রিয় সারির প্রত্যক্ষ খরচ</div><div class="stat-value" id="boq-direct">${money(boqDirect(p))}</div></div><div class="stat"><div class="stat-label">সব অতিরিক্ত খরচসহ মোট</div><div class="stat-value" id="boq-grand">${money(projectTotal({...p,method:'boq'}))}</div></div></div><div class="boq-list">${p.items.map((i,n)=>boqItemCard(p,i,n)).join('')}</div><section class="card" style="margin-top:16px">${extrasForm(p)}</section>`}
function costComponents(p){const direct=boqDirect(p),extras={উপকরণ:parseNum(p.materialCost,0),শ্রম:parseNum(p.laborCost,0),যন্ত্র:parseNum(p.equipmentCost,0),পরিবহন:parseNum(p.transportCost,0),'অন্যান্য প্রত্যক্ষ':parseNum(p.otherDirectCost,0)},extra=Object.values(extras).reduce((a,b)=>a+b,0),base=direct+extra,overhead=base*parseNum(p.overheadPct,0)/100,profit=(base+overhead)*parseNum(p.profitPct,0)/100,cont=(base+overhead+profit)*parseNum(p.contingencyPct,0)/100,tax=(base+overhead+profit+cont)*parseNum(p.taxPct,0)/100;return{rows:[['বিওকিউ সারি',direct],...Object.entries(extras),['ওভারহেড',overhead],['ঠিকাদার লাভ',profit],['অনিশ্চিত খরচ',cont],['কর / ভ্যাট',tax]],base,overhead,profit,cont,tax,total:base+overhead+profit+cont+tax}}
function renderProjectSummary(p){const comp=costComponents(p),max=Math.max(...comp.rows.map(r=>r[1]),1),mats=materialSummary(p.id),cats={};p.items.filter(i=>i.enabled).forEach(i=>cats[i.category]=(cats[i.category]||0)+parseNum(i.quantity,0)*(1+parseNum(i.allowance,0)/100)*parseNum(i.rate,0));const floors={};p.items.filter(i=>i.enabled).forEach(i=>{const k=i.floor==='সব'?'সব তলা':`${toBn(i.floor)} তলা`;floors[k]=(floors[k]||0)+parseNum(i.quantity,0)*(1+parseNum(i.allowance,0)/100)*parseNum(i.rate,0)});return`${projectStats(p)}<div class="project-grid" style="margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))"><section class="card"><div class="section-head" style="margin-top:0"><h2 class="section-title">খরচের বিভাজন</h2><button class="section-link" data-action="share-project" data-id="${p.id}">${icon('share')} শেয়ার</button></div><div class="cost-breakdown">${comp.rows.map(r=>`<div class="cost-line"><span>${r[0]}</span><div class="cost-track"><span style="width:${r[1]/max*100}%"></span></div><strong class="num">${money(r[1])}</strong></div>`).join('')}</div></section><section class="card"><h2 class="section-title" style="margin-bottom:12px">কাজের ধরন অনুযায়ী খরচ</h2>${Object.keys(cats).length?`<div class="list">${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(r=>`<div class="list-row"><div class="list-main"><div class="list-title">${esc(r[0])}</div></div><div class="list-value">${money(r[1])}</div></div>`).join('')}</div>`:'<p class="muted small">সক্রিয় বিওকিউ সারি যোগ করলে বিভাজন দেখা যাবে।</p>'}<h2 class="section-title" style="margin:20px 0 8px">তলা অনুযায়ী বরাদ্দ</h2>${Object.keys(floors).length?Object.entries(floors).map(r=>`<div class="list-row"><span>${r[0]}</span><strong style="margin-left:auto">${money(r[1])}</strong></div>`).join(''):'<p class="muted small">তলার বরাদ্দসহ সক্রিয় সারি নেই।</p>'}</section></div><div class="section-head"><h2 class="section-title">উপকরণের পরিমাণ সারাংশ</h2><button class="section-link" data-action="export-materials" data-id="${p.id}">${icon('download')} সিএসভি</button></div><section class="card">${mats.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>উপকরণ</th><th>পরিমাণ</th><th>একক</th><th>আনুমানিক খরচ</th></tr></thead><tbody>${mats.map(m=>`<tr><td>${esc(m.name)}</td><td>${fmt(m.qty,3)}</td><td>${esc(m.unit)}</td><td>${money(m.cost)}</td></tr>`).join('')}</tbody></table></div>`:emptyState('এখনো উপকরণের তথ্য নেই','ক্যালকুলেটরের ফলাফল এই প্রজেক্টে সংযুক্ত করে সংরক্ষণ করুন।','','','concrete')}</section>`}
function renderProjectList(){return pageHead('বাড়ির হিসাব','একাধিক বাড়ির হিসাব তৈরি, সম্পাদনা, নকল ও ব্যাকআপ করুন।',`<button class="btn btn-primary" data-action="new-project">${icon('plus')} নতুন প্রজেক্ট</button>`)+(state.projects.length?`<div class="project-grid">${state.projects.map(p=>`<article class="card project-card"><div class="rate-top"><h3>${esc(p.name)}</h3><span class="badge">${p.method==='quick'?'প্রাথমিক':'বিওকিউ'}</span></div><p class="small muted">${esc(p.location||'অবস্থান দেওয়া নেই')} · ${toBn(p.floors)} তলা</p><div class="project-total">${money(projectTotal(p))}</div><div class="progress"><span style="width:${projectProgress(p)}%"></span></div><p class="help">এস্টিমেট অগ্রগতি ${toBn(projectProgress(p))}%</p><div class="btn-row" style="margin-top:12px"><button class="btn btn-primary btn-sm" data-action="open-project" data-id="${p.id}">খুলুন ${icon('arrow')}</button><button class="btn btn-secondary btn-sm" data-action="duplicate-project" data-id="${p.id}">${icon('duplicate')} নকল</button><button class="btn btn-danger btn-sm" data-action="delete-project" data-id="${p.id}">${icon('trash')}</button></div></article>`).join('')}</div>`:emptyState('এখনো বাড়ির হিসাব নেই','নাম, অবস্থান, তলা ও নির্মিত এলাকা দিয়ে প্রথম বাড়ির হিসাব তৈরি করুন।','new-project','নতুন প্রজেক্ট','building'))}
function renderEstimate(){if(estimateView==='new'){$('#view').innerHTML=newProjectForm(projectFormMode==='edit'?activeProject():null);return}if(estimateView==='list'||!activeProject()){$('#view').innerHTML=renderProjectList();return}const p=activeProject();let body=currentProjectTab==='quick'?renderQuick(p):currentProjectTab==='boq'?renderBoq(p):currentProjectTab==='summary'?renderProjectSummary(p):renderProjectOverview(p);$('#view').innerHTML=projectHeader(p)+projectTabs(p)+body}

function printProject(p){let body='';if(p.method==='quick')body=`<div class="print-section"><h2>প্রাথমিক এস্টিমেট</h2>${reportTable([['নির্মিত এলাকা',`${p.quickArea} ${p.quickUnit==='m2'?'বর্গমিটার':'বর্গফুট'}`],['একক দর',money(p.quickRate)],['দরের উৎস',p.rateSource||'দেওয়া নেই'],['অতিরিক্ত খরচ',money(p.additionalCost)],['বাদের নোট',p.excludedNote||'নেই']])}</div>`;else{const c=costComponents(p);body=`<div class="print-section"><h2>বিস্তারিত বিওকিউ</h2><table class="print-table"><thead><tr><th>কাজ</th><th>পরিমাণ</th><th>একক</th><th>ভাতা</th><th>দর</th><th>মোট</th></tr></thead><tbody>${p.items.filter(i=>i.enabled).map(i=>`<tr><td>${esc(i.category)}${i.description?`<br>${esc(i.description)}`:''}</td><td>${fmt(i.quantity)}</td><td>${esc(i.unit)}</td><td>${fmt(i.allowance)}%</td><td>${money(i.rate)}</td><td>${money(parseNum(i.quantity,0)*(1+parseNum(i.allowance,0)/100)*parseNum(i.rate,0))}</td></tr>`).join('')}</tbody></table></div><div class="print-section"><h2>খরচের সারাংশ</h2>${reportTable(c.rows.map(r=>[r[0],money(r[1])]))}</div>`}const mats=materialSummary(p.id);if(mats.length)body+=`<div class="print-section"><h2>উপকরণের সারাংশ</h2>${reportTable(mats.map(m=>[`${m.name} (${m.unit})`,`${fmt(m.qty,3)} · ${money(m.cost)}`]))}</div>`;body+=`<div class="print-total">সর্বমোট: ${money(projectTotal(p))}</div><p>প্রকল্পের নোট: ${esc(p.notes||'নেই')}</p>`;printReport(p.method==='quick'?'প্রাথমিক নির্মাণ এস্টিমেট':'বিস্তারিত নির্মাণ বিওকিউ',body,p)}

async function importJSON(file){try{const data=JSON.parse((await file.text()).replace(/^\ufeff/,''));if(data.kind==='buildpro-backup'&&data.data?.version===1&&Array.isArray(data.data.projects)){state=Object.assign(defaultState(),data.data);toast('সম্পূর্ণ ব্যাকআপ পুনরুদ্ধার হয়েছে।','success')}else if(data.kind==='buildpro-project'&&data.project?.id&&data.project.name){const p=data.project;p.id=state.projects.some(x=>x.id===p.id)?uid('project'):p.id;p.items=(p.items||makeBoq()).map(i=>({...i,id:uid('boq')}));state.projects.unshift(p);(data.records||[]).forEach(r=>{r.id=uid('calc');r.projectId=p.id;state.records.unshift(r)});state.activeProjectId=p.id;toast('প্রজেক্ট ইমপোর্ট হয়েছে।','success')}else throw new Error('format');persist();renderNav();renderRoute()}catch(e){toast('ফাইলটি সঠিক BuildPro JSON ব্যাকআপ নয় বা তথ্য ক্ষতিগ্রস্ত।','error')}}
function renderRates(){const groups={};state.rates.forEach(r=>(groups[r.category]||(groups[r.category]=[])).push(r));$('#view').innerHTML=pageHead('উপকরণের দর','আপনার জানা দর, উৎস ও কার্যকর তারিখ সংরক্ষণ করুন। শূন্য দর বাজারদর নয়—সম্পাদনা করে নিজের তথ্য দিন।',`<button class="btn btn-secondary" data-action="export-rates">${icon('download')} সিএসভি</button><button class="btn btn-secondary" data-action="import-rates">${icon('upload')} ইমপোর্ট</button><button class="btn btn-primary" data-action="add-rate">${icon('plus')} নতুন দর</button><input type="file" id="rate-file" accept="text/csv,.csv" class="hidden">`)+`<section class="card" style="margin-bottom:16px"><div class="form-grid two">${field('ম্যানুয়াল শিডিউল-অব-রেটস প্রোফাইল',`<input id="rate-profile" value="${esc(state.rateProfile||'')}" placeholder="যেমন: আমার সরবরাহকারীর তালিকা, অক্টোবর ২০২৬">`,'অফলাইন প্রোফাইলের নাম বা উৎস লিখুন; কোনো লাইভ দর আনা হয় না।')}</div><button class="btn btn-secondary btn-sm" data-action="save-rate-profile" style="margin-top:10px">${icon('save')} প্রোফাইল সংরক্ষণ</button></section><div class="notice" style="margin-bottom:16px">${icon('info')}<p>দর বদলালে আপনি বেছে নিতে পারবেন শুধু ভবিষ্যতের হিসাবে প্রযোজ্য হবে, নাকি সক্রিয় প্রজেক্টের সংযুক্ত বিওকিউ সারিতেও বসবে। পুরোনো ক্যালকুলেটর স্ন্যাপশট অপরিবর্তিত থাকে।</p></div>${Object.entries(groups).map(([cat,rs])=>`<div class="section-head"><h2 class="section-title">${esc(cat)}</h2><span class="badge badge-neutral">${toBn(rs.length)}টি</span></div><div class="rate-catalog">${rs.map(r=>`<article class="rate-item"><div class="rate-top"><div><h3 style="font-size:.95rem;color:var(--navy)">${esc(r.name)}</h3><span class="badge badge-neutral">${esc(r.unit)}</span></div><div class="rate-price num">${money(r.rate)}<div class="list-meta">প্রতি ${esc(r.unit)}</div></div></div><div class="rate-meta">${esc(r.region||'অঞ্চল / সরবরাহকারী দেওয়া নেই')} · কার্যকর ${dateBn(r.date)}<br>${esc(r.source||'উৎস দেওয়া নেই')} · হালনাগাদ ${dateBn(r.updated)}</div><div class="row-actions" style="margin-top:10px"><button class="btn btn-secondary btn-sm" data-action="edit-rate" data-id="${r.id}">${icon('edit')} সম্পাদনা</button><button class="btn btn-danger btn-sm" data-action="delete-rate" data-id="${r.id}">${icon('trash')} মুছুন</button></div></article>`).join('')}</div>`).join('')}`}
function rateDialog(rate=null){$('#dialog-title').textContent=rate?'দর সম্পাদনা':'নতুন উপকরণ / সেবার দর';$('#dialog-body').innerHTML=`<form id="rate-form" data-id="${rate?.id||''}"><div class="form-grid two">${field('নাম <span class="required">*</span>',`<input name="name" value="${esc(rate?.name||'')}" required>`)}${field('বিভাগ',`<select name="category">${['উপকরণ','শ্রম','সেবা','অন্যান্য'].map(x=>`<option ${rate?.category===x?'selected':''}>${x}</option>`).join('')}</select>`)}${field('একক <span class="required">*</span>',`<input name="unit" value="${esc(rate?.unit||'')}" placeholder="ব্যাগ, কেজি, ঘনফুট">`)}${field('দর (৳)',`<input name="rate" inputmode="decimal" value="${esc(rate?.rate||0)}">`)}${field('মুদ্রা',`<select name="currency"><option value="BDT">বাংলাদেশি টাকা (৳)</option></select>`)}${field('অঞ্চল / সরবরাহকারী',`<input name="region" value="${esc(rate?.region||'')}">`)}${field('কার্যকর তারিখ',`<input type="date" name="date" value="${esc(rate?.date||today())}">`)}${field('উৎস / নোট',`<textarea name="source">${esc(rate?.source||'')}</textarea>`)}</div><p class="field-error hidden" id="rate-error"></p></form>`;$('#dialog-actions').innerHTML=`<button class="btn btn-secondary" data-action="close-dialog">বাতিল</button><button class="btn btn-primary" data-action="save-rate">${icon('save')} সংরক্ষণ</button>`;$('#app-dialog').showModal()}
function saveRate(){const form=$('#rate-form'),d=Object.fromEntries(new FormData(form)),rate=parseNum(d.rate),err=$('#rate-error');if(!d.name.trim()||!d.unit.trim()||!Number.isFinite(rate)||rate<0){err.textContent='নাম, একক ও শূন্য বা তার বেশি বৈধ দর দিন।';err.classList.remove('hidden');return}const old=state.rates.find(r=>r.id===form.dataset.id);const apply=scope=>{const r=old||{id:uid('rate')};Object.assign(r,d,{rate,updated:new Date().toISOString()});if(!old)state.rates.push(r);if(scope==='current'&&state.activeProjectId){const p=activeProject();p.items.forEach(i=>{if(i.rateId===r.id&&i.unit.trim()===r.unit.trim())i.rate=rate});p.updatedAt=new Date().toISOString()}persist();closeDialog();renderNav();renderRoute();toast(scope==='current'?'দর ও সক্রিয় প্রজেক্টের মিলে যাওয়া সারি হালনাগাদ হয়েছে।':'দর সংরক্ষিত হয়েছে; ভবিষ্যতের হিসাবে প্রযোজ্য হবে।','success')};if(old&&state.projects.length){$('#dialog-title').textContent='দরের পরিবর্তন কোথায় প্রয়োগ করবেন?';$('#dialog-body').innerHTML=`<div class="notice">${icon('info')}<p>পুরোনো ক্যালকুলেটর স্ন্যাপশট বদলাবে না। সক্রিয় প্রজেক্টে শুধু এই দরের সঙ্গে সংযুক্ত এবং একই এককের বিওকিউ সারি হালনাগাদ হবে।</p></div>`;$('#dialog-actions').innerHTML=`<button class="btn btn-secondary" data-action="rate-scope" data-scope="future">শুধু ভবিষ্যতের হিসাব</button><button class="btn btn-primary" data-action="rate-scope" data-scope="current">সক্রিয় প্রজেক্টেও</button>`;dialogCallback=apply}else apply('future')}
function exportRates(){const rows=[['নাম','বিভাগ','একক','দর','মুদ্রা','অঞ্চল বা সরবরাহকারী','কার্যকর তারিখ','উৎস বা নোট','হালনাগাদ']];state.rates.forEach(r=>rows.push([r.name,r.category,r.unit,r.rate,r.currency,r.region,r.date,r.source,r.updated]));download(`BuildPro-উপকরণের-দর-${today()}.csv`,rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv;charset=utf-8');toast('দরের CSV ফাইল তৈরি হয়েছে।','success')}
function parseCSV(text){const rows=[];let row=[],cell='',quote=false;const s=String(text).replace(/^\ufeff/,'');for(let i=0;i<s.length;i++){const c=s[i];if(c==='"'){if(quote&&s[i+1]==='"'){cell+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&s[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
async function importRates(file){try{const rows=parseCSV(await file.text());if(rows.length<2)throw new Error('empty');const head=rows[0].map(x=>x.trim()),idx=name=>head.indexOf(name);if(idx('নাম')<0||idx('দর')<0||idx('একক')<0)throw new Error('headers');let count=0;rows.slice(1).forEach(row=>{const rate=parseNum(row[idx('দর')]);if(!row[idx('নাম')]?.trim()||!row[idx('একক')]?.trim()||!Number.isFinite(rate)||rate<0)return;state.rates.push({id:uid('rate'),name:row[idx('নাম')],category:row[idx('বিভাগ')]||'অন্যান্য',unit:row[idx('একক')],rate,currency:'BDT',region:row[idx('অঞ্চল বা সরবরাহকারী')]||'',date:row[idx('কার্যকর তারিখ')]||today(),source:row[idx('উৎস বা নোট')]||'CSV ইমপোর্ট',updated:new Date().toISOString()});count++});if(!count)throw new Error('invalid');persist();renderRoute();toast(`${toBn(count)}টি দর ইমপোর্ট হয়েছে।`,'success')}catch(e){toast('CSV পড়া যায়নি। BuildPro-এর রপ্তানিকৃত শিরোনামসহ বৈধ দরের ফাইল দিন।','error')}}

function renderDrawings(){const p=state.projects.find(x=>x.id===drawingProjectId),notes=p?(p.drawingNotes||''):state.drawingNotes,rooms=state.rooms.filter(r=>(r.projectId||'')===drawingProjectId);$('#view').innerHTML=pageHead('বাড়ির ড্রইং প্ল্যানসমূহ','প্রকল্পের পরিকল্পনা নোট ও রুম শিডিউল রাখুন।',`<button class="btn btn-primary" data-action="add-room">${icon('plus')} রুম যোগ করুন</button>`,'more')+`<div class="notice notice-warning" style="margin-bottom:16px">${icon('warning')}<p><strong>নিচের লেআউট দৃষ্টান্তমূলক।</strong> এগুলি প্রকৌশলী-অনুমোদিত কাঠামোগত বা নির্মাণ অঙ্কন নয় এবং সরাসরি নির্মাণে ব্যবহার করা যাবে না।</p></div><section class="card" style="margin-bottom:16px"><div class="form-grid two">${field('প্রজেক্ট',`<select id="drawing-project"><option value="">সাধারণ পরিকল্পনা</option>${state.projects.map(x=>`<option value="${x.id}" ${x.id===drawingProjectId?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`)}${field('পরিকল্পনা ও তলার বিবরণ',`<textarea id="drawing-notes">${esc(notes)}</textarea>`,'চাহিদা, সাইটের দিক, তলার ব্যবহার ও আলো-বাতাসের নোট লিখুন।')}</div><button class="btn btn-primary btn-sm" data-action="save-drawing-notes" style="margin-top:10px">${icon('save')} নোট সংরক্ষণ</button></section><div class="section-head"><h2 class="section-title">দৃষ্টান্তমূলক নমুনা লেআউট</h2></div><div class="project-grid"><section class="card"><h3 style="font-size:.95rem;margin-bottom:10px;color:var(--navy)">নমুনা ১ · কমপ্যাক্ট বিন্যাস</h3>${sampleLayout(1)}<button class="btn btn-secondary btn-sm" data-action="load-sample-rooms" data-kind="1" style="margin-top:10px">${icon('copy')} রুম শিডিউলে নিন</button></section><section class="card"><h3 style="font-size:.95rem;margin-bottom:10px;color:var(--navy)">নমুনা ২ · পরিবারের বিন্যাস</h3>${sampleLayout(2)}<button class="btn btn-secondary btn-sm" data-action="load-sample-rooms" data-kind="2" style="margin-top:10px">${icon('copy')} রুম শিডিউলে নিন</button></section></div><div class="section-head"><h2 class="section-title">রুম শিডিউল</h2><span class="badge badge-neutral">${toBn(rooms.length)}টি</span></div>${rooms.length?`<section class="card"><div class="table-wrap"><table class="data-table"><thead><tr><th>রুম</th><th>তলা</th><th>দৈর্ঘ্য × প্রস্থ</th><th>এলাকা</th><th>নোট</th><th>কাজ</th></tr></thead><tbody>${rooms.map(r=>{const area=L(r.length,r.unit)*L(r.width,r.unit);return`<tr><td>${esc(r.name)}</td><td>${esc(r.floor)}</td><td>${fmt(r.length)} × ${fmt(r.width)} ${unitLen[r.unit]}</td><td>${fmt(area*M2FT)} বর্গফুট</td><td>${esc(r.notes)}</td><td><div class="row-actions"><button class="btn btn-secondary btn-sm" data-action="edit-room" data-id="${r.id}">${icon('edit')}</button><button class="btn btn-danger btn-sm" data-action="delete-room" data-id="${r.id}">${icon('trash')}</button></div></td></tr>`}).join('')}</tbody></table></div></section>`:emptyState('রুম শিডিউল খালি','নিজের রুম যোগ করুন অথবা নমুনা থেকে শিডিউল নিয়ে মাপ সম্পাদনা করুন।','add-room','রুম যোগ করুন','building')}`}
function roomDialog(room=null){$('#dialog-title').textContent=room?'রুম সম্পাদনা':'নতুন রুম';$('#dialog-body').innerHTML=`<form id="room-form" data-id="${room?.id||''}"><div class="form-grid two">${field('রুমের নাম',`<input name="name" value="${esc(room?.name||'')}" required>`)}${field('তলা / অবস্থান',`<input name="floor" value="${esc(room?.floor||'নিচতলা')}">`)}${field('দৈর্ঘ্য',`<input name="length" inputmode="decimal" value="${esc(room?.length||12)}">`)}${field('প্রস্থ',`<input name="width" inputmode="decimal" value="${esc(room?.width||10)}">`)}${field('একক',`<select name="unit"><option value="ft" ${room?.unit!=='m'?'selected':''}>ফুট</option><option value="m" ${room?.unit==='m'?'selected':''}>মিটার</option></select>`)}${field('নোট',`<textarea name="notes">${esc(room?.notes||'')}</textarea>`)}</div><p id="room-error" class="field-error hidden"></p></form>`;$('#dialog-actions').innerHTML=`<button class="btn btn-secondary" data-action="close-dialog">বাতিল</button><button class="btn btn-primary" data-action="save-room">${icon('save')} সংরক্ষণ</button>`;$('#app-dialog').showModal()}
function saveRoom(){const form=$('#room-form'),d=Object.fromEntries(new FormData(form)),len=parseNum(d.length),wid=parseNum(d.width);if(!d.name.trim()||!Number.isFinite(len)||len<=0||!Number.isFinite(wid)||wid<=0){$('#room-error').textContent='রুমের নাম ও শূন্যের বেশি দৈর্ঘ্য-প্রস্থ দিন।';$('#room-error').classList.remove('hidden');return}const old=state.rooms.find(r=>r.id===form.dataset.id),r=old||{id:uid('room')};Object.assign(r,d,{length:len,width:wid,projectId:drawingProjectId});if(!old)state.rooms.push(r);persist();closeDialog();renderDrawings();toast('রুম শিডিউল সংরক্ষণ হয়েছে।','success')}
function renderLibrary(){$('#view').innerHTML=pageHead('গুরুত্বপূর্ণ কিছু বিষয়সমূহ','সংক্ষিপ্ত শিক্ষামূলক রেফারেন্স ও আপনার নিজের নোট।',`<button class="btn btn-primary" data-action="add-note">${icon('plus')} ব্যক্তিগত নোট</button>`,'more')+`<div class="library-list">${LIBRARY.map((a,i)=>`<details class="library-item" ${i===0?'open':''}><summary>${a[0]}</summary><div class="library-body">${a[1]}</div></details>`).join('')}</div><div class="section-head"><h2 class="section-title">আমার নোট</h2><span class="badge badge-neutral">${toBn(state.notes.length)}টি</span></div>${state.notes.length?`<div class="project-grid">${state.notes.map(n=>`<article class="card"><h3 style="font-size:.95rem;color:var(--navy)">${esc(n.title)}</h3><p class="small muted" style="white-space:pre-wrap;margin:8px 0">${esc(n.text)}</p><div class="list-meta">${dateBn(n.updated)}</div><div class="row-actions" style="margin-top:10px"><button class="btn btn-secondary btn-sm" data-action="edit-note" data-id="${n.id}">${icon('edit')} সম্পাদনা</button><button class="btn btn-danger btn-sm" data-action="delete-note" data-id="${n.id}">${icon('trash')} মুছুন</button></div></article>`).join('')}</div>`:emptyState('ব্যক্তিগত নোট নেই','সাইটের সিদ্ধান্ত, সরবরাহকারীর তথ্য বা যাচাইয়ের বিষয় লিখে রাখুন।','add-note','নোট যোগ করুন','notes')}`}
function noteDialog(note=null){$('#dialog-title').textContent=note?'নোট সম্পাদনা':'ব্যক্তিগত নোট';$('#dialog-body').innerHTML=`<form id="note-form" data-id="${note?.id||''}">${field('শিরোনাম',`<input name="title" value="${esc(note?.title||'')}">`)}<div style="margin-top:12px">${field('নোট',`<textarea name="text" style="min-height:160px">${esc(note?.text||'')}</textarea>`)}</div><p id="note-error" class="field-error hidden"></p></form>`;$('#dialog-actions').innerHTML=`<button class="btn btn-secondary" data-action="close-dialog">বাতিল</button><button class="btn btn-primary" data-action="save-note">${icon('save')} সংরক্ষণ</button>`;$('#app-dialog').showModal()}
function saveNote(){const form=$('#note-form'),d=Object.fromEntries(new FormData(form));if(!d.title.trim()||!d.text.trim()){$('#note-error').textContent='শিরোনাম ও নোট দুটিই লিখুন।';$('#note-error').classList.remove('hidden');return}const old=state.notes.find(n=>n.id===form.dataset.id),n=old||{id:uid('note')};Object.assign(n,d,{updated:new Date().toISOString()});if(!old)state.notes.unshift(n);persist();closeDialog();renderLibrary();toast('নোট সংরক্ষণ হয়েছে।','success')}
function selfTests(){const tests=[];const test=(name,actual,expected,tol=1e-6)=>tests.push({name,pass:Math.abs(actual-expected)<=tol,actual,expected});test('১ ফুট = ০.৩০৪৮ মিটার',L(1,'ft'),.3048);test('১২ ইঞ্চি = ১ ফুট',L(12,'in'),L(1,'ft'));test('১ ঘনমিটার ≈ ৩৫.৩১৪৭ ঘনফুট',M3FT,35.3147,.0001);test('১ শতক = ৪৩৫.৬ বর্গফুট',state.settings.decimal,435.6);const tile=calcTiles({length:12,width:10,unit:'ft',deduction:0,deductionUnit:'ft2',tileLength:2,tileWidth:2,tileUnit:'ft',waste:8,price:0,laborRate:0,laborUnit:'ft2',other:0});test('টাইল পরীক্ষা: ৩০ পিস মূল',tile.rows?parseFloat(toEn(tile.rows[3][1]).replace(/,/g,'')):NaN,30,.01);test('টাইল পরীক্ষা: ৩৩ পিস ক্রয়',tile.materials?.[0]?.qty,33);test('১২ মিমি রড ≈ ০.৮৮৯ কেজি/মিটার',12**2/162,.889,.001);const conc=calcConcrete({shape:'rect',length:12,width:10,height:5,heightUnit:'in',unit:'ft',quantity:1,mix:'1:2:4',dryFactor:1.5,bagWeight:50,density:1440,cementPrice:0,sandPrice:0,aggPrice:0,volumeRateUnit:'ft3',labor:0,waste:0});test('কংক্রিট পরীক্ষা: ৫০ ঘনফুট',conc.rows?parseFloat(toEn(conc.rows[0][1].split(' ')[0]).replace(/,/g,'')):NaN,50,.001);test('কংক্রিট পরীক্ষা: ১.৪১৬ ঘনমিটার',conc.rows?parseFloat(toEn(conc.rows[0][1].split('·')[1]).replace(/,/g,'')):NaN,1.416,.001);const land=calcLand({mode:'quick',length1:40,length2:40,width1:30,width2:30,unit:'ft'});test('জমি পরীক্ষা: ১২০০ বর্গফুট',land.rows?parseFloat(toEn(land.rows[0][1]).replace(/,/g,'')):NaN,1200,.01);test('বেনগালি সংখ্যা পার্সিং',parseNum('১২.৫'),12.5);return tests}
function runSelfTests(){const tests=selfTests(),passed=tests.filter(t=>t.pass).length;$('#self-test-results').innerHTML=`<div class="notice ${passed===tests.length?'':'notice-danger'}" style="margin-bottom:10px">${icon(passed===tests.length?'check':'warning')}<p>${toBn(passed)} / ${toBn(tests.length)}টি পরীক্ষা সফল।</p></div>`+tests.map(t=>`<div class="test-row"><span>${t.name}</span><strong class="${t.pass?'test-pass':'test-fail'}">${t.pass?'সফল':'ব্যর্থ'}</strong></div>`).join('');toast(passed===tests.length?'সব মূল গাণিতিক পরীক্ষা সফল।':'কিছু পরীক্ষা ব্যর্থ হয়েছে।',passed===tests.length?'success':'error')}
function renderSettings(){$('#view').innerHTML=pageHead('সেটিংস ও স্ব-পরীক্ষা','স্থানীয় জমির একক সম্পাদনা, ডেটা সুরক্ষা ও মূল সূত্র যাচাই করুন।','','more')+`<div class="project-grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))"><section class="card"><h2 class="section-title" style="margin-bottom:12px">জমির স্থানীয় রূপান্তর</h2><form id="settings-form"><div class="form-grid two">${field('১ শতক = বর্গফুট',`<input name="decimal" inputmode="decimal" value="${state.settings.decimal}">`)}${field('১ কাঠা = বর্গফুট',`<input name="katha" inputmode="decimal" value="${state.settings.katha}">`)}${field('১ বিঘা = কাঠা',`<input name="bighaKatha" inputmode="decimal" value="${state.settings.bighaKatha}">`)}${field('১ একর = বর্গফুট',`<input name="acre" inputmode="decimal" value="${state.settings.acre}">`)}${field('১ বর্গমিটার = বর্গফুট',`<input name="sqm" inputmode="decimal" value="${state.settings.sqm}">`)}</div><div class="btn-row" style="margin-top:14px"><button class="btn btn-primary" type="submit">${icon('save')} সেটিংস সংরক্ষণ</button><button class="btn btn-secondary" type="button" data-action="default-settings">ডিফল্ট ফেরান</button></div></form></section><section class="card"><h2 class="section-title">মূল গাণিতিক স্ব-পরীক্ষা</h2><p class="small muted" style="margin:6px 0 12px">একক রূপান্তর, বাংলা সংখ্যা, টাইল, রড, কংক্রিট ও জমির পরিচিত মান যাচাই করা হয়।</p><button class="btn btn-primary" data-action="run-tests">${icon('check')} পরীক্ষা চালান</button><div id="self-test-results" style="margin-top:14px"></div></section></div><section class="card" style="margin-top:16px"><h2 class="section-title">ডেটা ও ব্যাকআপ</h2><p class="small muted" style="margin:6px 0 14px">তথ্য সংরক্ষণের ধরন: সংস্করণ ${toBn(CONFIG.version)} · প্রজেক্ট ${toBn(state.projects.length)}টি · হিসাব ${toBn(state.records.length)}টি। ডেটা শুধু এই ব্রাউজারে থাকে, ক্লাউডে সিঙ্ক হয় না।</p><div class="btn-row"><button class="btn btn-secondary" data-action="export-all">${icon('download')} সম্পূর্ণ JSON ব্যাকআপ</button><button class="btn btn-secondary" data-action="import-json">${icon('upload')} JSON পুনরুদ্ধার</button><button class="btn btn-danger" data-action="clear-all">${icon('trash')} সব মুছুন</button></div><input type="file" id="json-file" accept="application/json,.json" class="hidden"></section>`}
function renderHelp(){const steps=[['দর লিখুন (ইচ্ছা হলে)','আপনার এলাকার সরবরাহকারী বা ঠিকাদারের দর যোগ করুন। এখন না জানলেও সমস্যা নেই—পরে দর বসাতে পারবেন। শূন্য দর বাজারদর নয়।'],['বাড়ির হিসাব তৈরি করুন','বাড়ির নাম, তলার সংখ্যা ও প্রতি তলার আনুমানিক এলাকা লিখুন। তথ্য পরে সম্পাদনা করা যাবে। কোনো প্রজেক্ট ছাড়াও ক্যালকুলেটর ব্যবহার করতে পারবেন।'],['মাপ থেকে ফলাফল দেখুন','যে কাজের হিসাব দরকার, সেটির ক্যালকুলেটর খুলুন। মাপ ও দর লিখুন; চাইলে ফলাফল বাড়ির হিসাবের সঙ্গে যুক্ত করে সংরক্ষণ করুন।'],['প্রিন্ট ও ব্যাকআপ রাখুন','নকশা ও সাইটের মাপের সঙ্গে ফলাফল মিলিয়ে নিন। প্রতিবেদন প্রিন্ট/PDF করুন এবং নিয়মিত JSON ব্যাকআপ নামিয়ে রাখুন।']];const list=steps.map((s,i)=>'<div class="list-row"><span class="badge">'+toBn(i+1)+'</span><div class="list-main"><h3 class="list-title">'+s[0]+'</h3><p class="list-meta">'+s[1]+'</p></div></div>').join('');$('#view').innerHTML=pageHead('সহজ ব্যবহার নির্দেশিকা','শুরু থেকে হিসাব সংরক্ষণ—প্রতিটি ধাপ এক জায়গায়।','','more')+'<section class="card"><div class="list">'+list+'</div></section><div class="section-head"><h2 class="section-title">প্রিন্ট, PDF ও শেয়ার</h2></div><section class="card"><p class="small muted">“প্রিন্ট” চাপলে প্রিন্টের অপশন খুলবে। PDF রাখতে গন্তব্যে “PDF হিসেবে সংরক্ষণ” বেছে নিন। ব্রাউজারে শেয়ার সুবিধা না থাকলে প্রতিবেদনের লেখা কপি করে পাঠাতে পারবেন। ফাইল কোথায় সংরক্ষণ হবে, তা ব্রাউজারের সেটিংসের ওপর নির্ভর করে।</p></section><div class="notice notice-warning" style="margin-top:16px">'+icon('warning')+'<p>এই অ্যাপ প্রাথমিক হিসাব করতে সাহায্য করে; এটি প্রকৌশলীর নকশা বা অনুমোদনের বিকল্প নয়। নির্মাণের আগে সাইটের মাপ ও কাঠামোগত নকশা যোগ্য প্রকৌশলীর সঙ্গে যাচাই করুন।</p></div>'}
function printCalcRecord(r){const p=state.projects.find(x=>x.id===r.projectId),body=`<div class="print-section"><h2>${esc(r.title)}</h2>${reportTable(r.rows)}</div><div class="print-total">মোট আনুমানিক খরচ: ${money(r.total)}</div><div class="print-section"><h2>সূত্র ও অনুমান</h2><p>${r.formula}</p></div>`;printReport(r.title,body,p)}
function recordText(r){return`${r.title}\n${r.rows.map(x=>`${x[0]}: ${x[1]}`).join('\n')}\nমোট: ${money(r.total)}`}
function renderRoute(){renderNav();const {page,sub}=routeInfo();if(page==='home')renderHome();else if(page==='calculators')renderCalculators();else if(page==='calculator'){const editing=state.records.find(r=>r.id===editRecordId);if(editing&&editing.type!==sub)editRecordId=null;renderCalculator(sub);}else if(page==='estimate')renderEstimate();else if(page==='files')renderFiles();else if(page==='rates')renderRates();else if(page==='more')renderMore();else if(page==='drawings')renderDrawings();else if(page==='library')renderLibrary();else if(page==='settings')renderSettings();else if(page==='help')renderHelp();else go('home')}
let calcTimer,persistTimer;
function schedulePersist(){clearTimeout(persistTimer);persistTimer=setTimeout(persist,250)}
function normalizeBbs(v,remove=-1,add=false){const rows=[];for(let i=0;i<30;i++){if(v[`bbs-mark-${i}`]===undefined)continue;if(i!==remove)rows.push({mark:v[`bbs-mark-${i}`],shape:v[`bbs-shape-${i}`],dia:v[`bbs-dia-${i}`],length:v[`bbs-length-${i}`],qty:v[`bbs-qty-${i}`]})}if(add)rows.push({mark:String.fromCharCode(65+rows.length),shape:'সোজা রড',dia:'12',length:'12',qty:'1'});Object.keys(v).filter(k=>k.startsWith('bbs-')).forEach(k=>delete v[k]);rows.forEach((r,i)=>{v[`bbs-mark-${i}`]=r.mark;v[`bbs-shape-${i}`]=r.shape;v[`bbs-dia-${i}`]=r.dia;v[`bbs-length-${i}`]=r.length;v[`bbs-qty-${i}`]=r.qty})}
function exportMaterials(id){const mats=materialSummary(id),rows=[['উপকরণ','পরিমাণ','একক','আনুমানিক খরচ']];mats.forEach(m=>rows.push([m.name,m.qty,m.unit,m.cost]));download('BuildPro-উপকরণের-সারাংশ.csv',rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv;charset=utf-8');toast('উপকরণের CSV তৈরি হয়েছে।','success')}
async function shareProject(id){const p=state.projects.find(x=>x.id===id);if(!p)return;const text=projectShareText(p);if(navigator.share){try{await navigator.share({title:`${p.name} — নির্মাণ হিসাব`,text});toast('শেয়ার ডায়ালগ সম্পূর্ণ হয়েছে।','success')}catch(e){if(e.name!=='AbortError'){await copyText(text)}}}else await copyText(text)}
function handleBoqField(target){const p=activeProject();if(!p)return;const item=p.items.find(i=>i.id===target.dataset.id);if(!item)return;const key=target.dataset.itemField;let val=target.type==='checkbox'?target.checked:target.value;if(target.dataset.number){const n=parseNum(val);if(!Number.isFinite(n)||n<0){target.setAttribute('aria-invalid','true');return}target.removeAttribute('aria-invalid');val=n}if(key==='rateId'){const r=state.rates.find(x=>x.id===val);if(r){if(r.unit.trim()!==item.unit.trim()){target.value='';toast('সংরক্ষিত দরের একক ও কাজের একক মিলছে না। আগে একক ঠিক করুন।','error');return}item.rate=r.rate;item.source=r.source||r.region||'সংরক্ষিত দর'}item.rateId=val;p.updatedAt=new Date().toISOString();persist();renderEstimate();return}item[key]=val;if(key==='category')target.closest('.boq-item').querySelector('.boq-title').textContent=val;p.updatedAt=new Date().toISOString();schedulePersist();const amount=parseNum(item.quantity,0)*(1+parseNum(item.allowance,0)/100)*parseNum(item.rate,0);const out=$(`[data-item-amount="${item.id}"]`);if(out)out.textContent=money(amount);updateBoqAmounts(p);if(key==='enabled')renderEstimate()}
document.addEventListener('click',async e=>{const r=e.target.closest('[data-route]');if(r){e.preventDefault();go(r.dataset.route);return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id,p=activeProject();e.preventDefault();switch(a){
case'close-dialog':closeDialog();break;
case'confirm-dialog':{const req=b.dataset.require;if(req&&$('#confirm-text').value.trim()!==req){$('#confirm-error').classList.remove('hidden');return}const cb=dialogCallback;if(cb)cb();break}
case'new-project':projectFormMode='new';estimateView='new';go('estimate');break;
case'project-list':estimateView='list';go('estimate');break;
case'open-project':state.activeProjectId=id;estimateView='active';currentProjectTab='overview';persist();go('estimate');break;
case'edit-project':state.activeProjectId=id;projectFormMode='edit';estimateView='new';go('estimate');break;
case'duplicate-project':duplicateProject(id);break;
case'delete-project':deleteProject(id);break;
case'export-project':exportProject(id);break;
case'project-tab':currentProjectTab=b.dataset.tab;renderEstimate();window.scrollTo({top:0,behavior:'smooth'});break;
case'activate-method':if(p){p.method=b.dataset.method;p.updatedAt=new Date().toISOString();persist();renderEstimate();toast('সক্রিয় এস্টিমেট পদ্ধতি বদলেছে; অন্য পদ্ধতির খরচ যোগ হয়নি।','success')}break;
case'print-project':{const x=state.projects.find(x=>x.id===id);if(x)printProject(x);break}
case'share-project':await shareProject(id);break;
case'export-boq':{const x=state.projects.find(x=>x.id===id);if(x){download(`${x.name}-বিওকিউ.csv`,projectCSV(x),'text/csv;charset=utf-8');toast('বিওকিউ CSV তৈরি হয়েছে।','success')}break}
case'export-materials':exportMaterials(id);break;
case'boq-add':if(p){p.items.push({id:uid('boq'),number:p.items.length+1,category:'নতুন কাজ',description:'',quantity:0,unit:'কাজ',rate:0,allowance:0,source:'',rateId:'',remarks:'',floor:'সব',enabled:true});p.method='boq';persist();renderEstimate()}break;
case'boq-up':case'boq-down':if(p){const n=p.items.findIndex(i=>i.id===id),to=a==='boq-up'?n-1:n+1;if(n>=0&&to>=0&&to<p.items.length){[p.items[n],p.items[to]]=[p.items[to],p.items[n]];persist();renderEstimate()}}break;
case'boq-duplicate':if(p){const n=p.items.findIndex(i=>i.id===id);if(n>=0){const copy={...p.items[n],id:uid('boq'),category:`${p.items[n].category} — নকল`};p.items.splice(n+1,0,copy);persist();renderEstimate()}}break;
case'boq-delete':if(p){const item=p.items.find(i=>i.id===id);confirmDialog('বিওকিউ সারি মুছবেন?',`“${item?.category||'এই কাজ'}” সারিটি মুছে যাবে।`,()=>{p.items=p.items.filter(i=>i.id!==id);persist();closeDialog();renderEstimate();toast('কাজের সারি মুছে ফেলা হয়েছে।','success')},'মুছুন',true)}break;
case'reset-calc':{const {sub}=routeInfo();confirmDialog('ক্যালকুলেটর রিসেট করবেন?','বর্তমান ইনপুট মুছে ডিফল্ট মান ফিরবে। আগে সংরক্ষিত ফলাফল অপরিবর্তিত থাকবে।',()=>{delete drafts[sub];editRecordId=null;closeDialog();renderCalculator(sub);toast('ক্যালকুলেটর রিসেট হয়েছে।','success')},'রিসেট করুন',true);break}
case'save-calc':saveCalculation();break;
case'copy-calc':if(lastCalculation&&!lastCalculation.result.errors)await copyText(resultText(lastCalculation.type,lastCalculation.values,lastCalculation.result));break;
case'print-calc':if(lastCalculation&&!lastCalculation.result.errors){const t=lastCalculation.type,r=lastCalculation.result;printCalcRecord({title:CALC_META[t][0],rows:r.rows,total:r.total,formula:r.formula,projectId:lastCalculation.values.projectId})}break;
case'delete-editing-record':if(editRecordId)deleteRecord(editRecordId);break;
case'bbs-add':case'bbs-remove':{const type=routeInfo().sub,v=readCalcForm();Object.assign(drafts[type],v);normalizeBbs(drafts[type],a==='bbs-remove'?Number(b.dataset.index):-1,a==='bbs-add');renderCalculator(type);break}
case'edit-record':openRecord(id);break;
case'delete-record':deleteRecord(id);break;
case'duplicate-record':{const r0=state.records.find(x=>x.id===id);if(r0){const copy=structuredClone(r0);copy.id=uid('calc');copy.createdAt=copy.updatedAt=new Date().toISOString();state.records.unshift(copy);persist();renderRoute();toast('হিসাবের নকল তৈরি হয়েছে।','success')}break}
case'copy-record':{const r0=state.records.find(x=>x.id===id);if(r0)await copyText(recordText(r0));break}
case'print-record':{const r0=state.records.find(x=>x.id===id);if(r0)printCalcRecord(r0);break}
case'record-to-boq':{const r0=state.records.find(x=>x.id===id),proj=state.projects.find(x=>x.id===r0?.projectId);if(r0&&proj){const source=`সংরক্ষিত হিসাব: ${r0.id}`;if(proj.items.some(i=>i.source===source)){toast('এই হিসাবটি আগেই বিওকিউতে যোগ করা হয়েছে।','error');break}proj.items.push({id:uid('boq'),category:r0.title,description:'ক্যালকুলেটর থেকে সামগ্রিক খরচ; পুনরায় খরচ যোগ করবেন না',quantity:1,unit:'কাজ',rate:r0.total,allowance:0,source,rateId:'',remarks:'মূল ইনপুট সংরক্ষিত হিসাবে দেখুন',floor:'সব',enabled:true});proj.method='boq';proj.updatedAt=new Date().toISOString();persist();toast('হিসাবটি একটি সামগ্রিক বিওকিউ সারি হিসেবে যোগ হয়েছে।','success');renderRoute()}break}
case'export-all':exportAll();break;
case'import-json':$('#json-file')?.click();break;
case'export-rates':exportRates();break;
case'import-rates':$('#rate-file')?.click();break;
case'add-rate':rateDialog();break;
case'edit-rate':rateDialog(state.rates.find(r=>r.id===id));break;
case'save-rate':saveRate();break;
case'rate-scope':{const cb=dialogCallback;if(cb)cb(b.dataset.scope);break}
case'delete-rate':{const r0=state.rates.find(r=>r.id===id);confirmDialog('দর মুছবেন?',`“${r0?.name||''}” মুছবে। বিওকিউ সারির বর্তমান দর থাকবে, তবে সংযোগ তুলে নেওয়া হবে।`,()=>{state.rates=state.rates.filter(r=>r.id!==id);state.projects.forEach(x=>x.items.forEach(i=>{if(i.rateId===id)i.rateId=''}));persist();closeDialog();renderRates();toast('দর মুছে ফেলা হয়েছে।','success')},'মুছুন',true);break}
case'save-rate-profile':state.rateProfile=$('#rate-profile').value.trim();persist();toast('শিডিউল প্রোফাইল সংরক্ষণ হয়েছে।','success');break;
case'add-room':roomDialog();break;
case'edit-room':roomDialog(state.rooms.find(r=>r.id===id));break;
case'save-room':saveRoom();break;
case'delete-room':confirmDialog('রুম মুছবেন?','রুম শিডিউলের এই সারিটি মুছে যাবে।',()=>{state.rooms=state.rooms.filter(r=>r.id!==id);persist();closeDialog();renderDrawings();toast('রুম মুছে ফেলা হয়েছে।','success')},'মুছুন',true);break;
case'load-sample-rooms':{const sample=b.dataset.kind==='1'?[['শোবার ঘর',12,12],['বসার ঘর',14,12],['রান্নাঘর',10,8],['খাবার',10,8],['স্নান',7,5]]:[['শোবার ঘর ১',12,11],['শোবার ঘর ২',12,11],['বসার ঘর',14,12],['রান্নাঘর',10,8],['খাবার',10,8],['স্নান',7,5],['সিঁড়ি / পরিচর্যা',10,6]];sample.forEach(x=>state.rooms.push({id:uid('room'),name:x[0],length:x[1],width:x[2],unit:'ft',floor:'দৃষ্টান্তমূলক',notes:'নমুনা মাপ; সাইট ও নকশা অনুযায়ী সম্পাদনা করুন',projectId:drawingProjectId}));persist();renderDrawings();toast('দৃষ্টান্তমূলক রুম শিডিউল যোগ হয়েছে; মাপ যাচাই করুন।','success');break}
case'save-drawing-notes':{const proj=state.projects.find(x=>x.id===drawingProjectId),text=$('#drawing-notes').value;if(proj)proj.drawingNotes=text;else state.drawingNotes=text;persist();toast('পরিকল্পনা নোট সংরক্ষণ হয়েছে।','success');break}
case'add-note':noteDialog();break;
case'edit-note':noteDialog(state.notes.find(n=>n.id===id));break;
case'save-note':saveNote();break;
case'delete-note':confirmDialog('নোট মুছবেন?','এই ব্যক্তিগত নোটটি মুছে যাবে।',()=>{state.notes=state.notes.filter(n=>n.id!==id);persist();closeDialog();renderLibrary();toast('নোট মুছে ফেলা হয়েছে।','success')},'মুছুন',true);break;
case'run-tests':runSelfTests();break;
case'default-settings':state.settings=defaultState().settings;persist();renderSettings();toast('জমির ডিফল্ট রূপান্তর ফিরিয়ে আনা হয়েছে।','success');break;
case'clear-all':confirmDialog('সব তথ্য স্থায়ীভাবে মুছবেন?','সব প্রজেক্ট, সংরক্ষিত হিসাব, দর, রুম ও নোট এই ব্রাউজার থেকে মুছে যাবে। আগে JSON ব্যাকআপ নিন।',()=>{state=defaultState();drafts={};editRecordId=null;drawingProjectId='';persist();closeDialog();go('home');toast('সব স্থানীয় তথ্য মুছে ফেলা হয়েছে।','success')},'সব মুছুন',true,'সব মুছুন');break;
}});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target;if(form.id==='calc-form')recalculate(true);else if(form.id==='project-form')saveProject(form);else if(form.id==='quick-form'){const p=activeProject(),d=Object.fromEntries(new FormData(form)),area=parseNum(d.quickArea),rate=parseNum(d.quickRate),add=parseNum(d.additionalCost);if(!Number.isFinite(area)||area<=0||!Number.isFinite(rate)||rate<0||!Number.isFinite(add)||add<0){toast('এলাকা শূন্যের বেশি এবং দর ও খরচ বৈধ ধনাত্মক সংখ্যা দিন।','error');return}Object.assign(p,d,{quickArea:area,quickRate:rate,additionalCost:add,updatedAt:new Date().toISOString()});persist();renderEstimate();toast('প্রাথমিক এস্টিমেট সংরক্ষণ হয়েছে।','success')}else if(form.id==='extras-form'){const p=activeProject(),d=Object.fromEntries(new FormData(form));let valid=true;Object.entries(d).forEach(([k,v])=>{const n=parseNum(v);if(!Number.isFinite(n)||n<0||(k.endsWith('Pct')&&n>100))valid=false;d[k]=n});if(!valid){toast('অতিরিক্ত খরচ শূন্য বা বেশি এবং শতাংশ ০–১০০-এর মধ্যে দিন।','error');return}Object.assign(p,d,{updatedAt:new Date().toISOString()});persist();renderEstimate();toast('অতিরিক্ত খরচ সংরক্ষণ হয়েছে।','success')}else if(form.id==='settings-form'){const d=Object.fromEntries(new FormData(form));let valid=true;Object.entries(d).forEach(([k,v])=>{const n=parseNum(v);if(!Number.isFinite(n)||n<=0)valid=false;d[k]=n});if(!valid){toast('সব রূপান্তর মান শূন্যের বেশি দিন।','error');return}state.settings=d;persist();toast('স্থানীয় এককের সেটিংস সংরক্ষণ হয়েছে।','success')}});
document.addEventListener('input',e=>{const t=e.target;if(t.closest('#calc-form')){clearTimeout(calcTimer);calcTimer=setTimeout(()=>recalculate(true),140)}if(t.matches('[data-item-field]'))handleBoqField(t);if(t.closest('#quick-form')){const p=activeProject(),d=Object.fromEntries(new FormData(t.form));$('#quick-total').textContent=money(projectTotal({...p,...d,method:'quick'}));$('#quick-rate').textContent=money(parseNum(d.quickRate,0));$('#quick-add').textContent=money(parseNum(d.additionalCost,0));$('#quick-area').textContent=`${fmt(parseNum(d.quickArea,0))} ${d.quickUnit==='m2'?'বর্গমিটার':'বর্গফুট'}`}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='global-project'){state.activeProjectId=t.value||null;drawingProjectId=state.activeProjectId||'';persist();renderNav();renderRoute();return}if(t.id==='file-type'){fileType=t.value;renderFiles();return}if(t.id==='file-search'){fileFilter=t.value;renderFiles();return}if(t.id==='drawing-project'){drawingProjectId=t.value;renderDrawings();return}if(t.id==='json-file'&&t.files[0]){importJSON(t.files[0]);t.value='';return}if(t.id==='rate-file'&&t.files[0]){importRates(t.files[0]);t.value='';return}if(t.closest('#calc-form')&&t.dataset.refreshForm){const type=routeInfo().sub,v=readCalcForm();Object.assign(drafts[type],v);if(type==='brick'&&t.name==='work')drafts[type].bricksPerM2=({flat:40,double:80,hbb:55}[t.value]||40);renderCalculator(type);return}if(t.matches('[data-item-field]')&&t.type!=='text')handleBoqField(t)});
document.addEventListener('keydown',e=>{if(e.target.id==='file-search'&&e.key==='Enter'){e.preventDefault();fileFilter=e.target.value;renderFiles()}});
$('#app-dialog').addEventListener('click',e=>{if(e.target===$('#app-dialog'))closeDialog()});
$('#app-dialog').addEventListener('close',()=>{dialogCallback=null});
window.addEventListener('hashchange',()=>{renderRoute();window.scrollTo(0,0);$('#view').focus({preventScroll:true})});
if(!location.hash)history.replaceState(null,'','#home');renderRoute();if(!storageOK)setTimeout(()=>toast('ব্রাউজার স্টোরেজ পাওয়া যায়নি; JSON ব্যাকআপ ব্যবহার করুন।','error'),400);
})();
</script>
</body>
</html>
